<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <!-- Digital House Logo -->
  <defs>
    <linearGradient id="dhGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdc76;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8d7a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- DH Icon -->
  <rect x="10" y="10" width="60" height="60" rx="8" fill="url(#dhGradient)"/>
  <text x="40" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#000" text-anchor="middle">DH</text>
  
  <!-- Digital House Text -->
  <text x="85" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffdc76">DIGITAL</text>
  <text x="85" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ff8d7a">HOUSE</text>
</svg>
